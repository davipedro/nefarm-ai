services:
  # Serviço Ollama - IA Local
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Serviço para baixar o modelo llama3:8b automaticamente
  ollama-model-loader:
    image: ollama/ollama
    container_name: ollama-model-loader
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      echo '🔄 Aguardando Ollama estar pronto...';
      sleep 5;
      echo '📥 Baixando modelo llama3:8b...';
      ollama pull llama3:8b;
      echo '✅ Modelo llama3:8b baixado com sucesso!';
      echo '🎯 Testando modelo...';
      ollama run llama3:8b 'Hello, world!';
      echo '✅ Setup completo! Ollama com llama3:8b está pronto para uso.';
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

volumes:
  ollama:
    driver: local
